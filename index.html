<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hexavo apps</title>
<meta name="description" content="Apps by Hexavo.">
<style>
:root { --bg:#FBF1E6; --card:#FFF8EE; --ink:#3E3228; --soft:#5F4E40; --accent:#B24B25; --rule:#EBD9C2; }
@media (prefers-color-scheme: dark) { :root { --bg:#1F1813; --card:#2A211A; --ink:#F5EADD; --soft:#C7B7A6; --accent:#F0A27E; --rule:#3B2F26; } }
body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 32px 20px 48px; }
h1 { font: 700 30px/1.2 ui-rounded, "SF Pro Rounded", -apple-system, sans-serif; margin: 0 0 6px; }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 18px 20px; margin-top: 18px; }
h2 { font: 700 20px/1.3 ui-rounded, "SF Pro Rounded", -apple-system, sans-serif; color: var(--accent); margin: 0 0 4px; }
p { margin: 4px 0; color: var(--soft); }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>Hexavo</h1>
<p>Apps made with care. Questions? <a href="mailto:infotech@hexavo.co.uk">infotech@hexavo.co.uk</a></p>
<div class="card">
<h2>Quiltdoku</h2>
<p>A cozy logic puzzle you sew together.</p>
<p><a href="/quiltdoku-legal/">Support</a> · <a href="/quiltdoku-legal/privacy.html">Privacy Policy</a></p>
</div>
</main>
</body>
</html>
